[workspace]
resolver = "3"
members = ["crates/*"]
# Patched copies of two upstream crates (see `[patch.crates-io]`). Excluded so they
# keep their own edition and lint settings rather than inheriting this workspace's —
# they are upstream source carried verbatim apart from the documented fix, and
# should stay easy to diff against the released crate.
exclude = ["third_party/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor the README promises, and the one CI actually builds against (the
# `msrv` job installs exactly this and runs `cargo check`). It said 1.85 for
# months while the tree used let-chains, stable only since 1.88 — nothing
# verified the claim, so it silently became a lie that would have met the first
# person to build from source. The job exists so that can't recur.
#
# delryn is an application, not a library: nobody depends on it, prebuilt
# binaries need no toolchain at all, and `rustup update` is one command. So this
# tracks current stable rather than the oldest version that happens to compile.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/dilmun/delryn"

[workspace.dependencies]
# RTL text for the terminal: reshape Arabic/Persian to presentation forms, then
# reorder each line to visual order (terminals — esp. under tmux — don't do bidi).
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
# External
anyhow = "1.0.102"
arboard = "3.6.1"
base64 = "0.22.1"
crossterm = "0.29.0"
ego-tree = "0.11"
epub = "2.1.5"
html2text = "0.17.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
libc = "0.2"
lru = "0.18.0"
pdfium-render = "0.9.2"
# RaTeX: pure-Rust math typesetting → PNG (KaTeX coverage, tiny-skia raster, embedded
# KaTeX fonts) — the typeset engine behind `delryn-eqn`'s render ladder.
ratex-layout = "0.1.12"
ratex-parser = "0.1.12"
ratex-render = { version = "0.1.12", features = ["embed-fonts"] }
ratex-types = "0.1.12"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.5", default-features = false, features = ["crossterm", "image-defaults"] }
rayon = "1.10"
regex = "1.12.4"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.2"
unicode-width = "0.2.2"
ureq = { version = "3", features = ["json"] }
zip = { version = "3", default-features = false, features = ["deflate"] }

# Internal crates (added as the workspace is carved up).
delryn-model = { path = "crates/delryn-model" }
delryn-infra = { path = "crates/delryn-infra" }
delryn-store = { path = "crates/delryn-store" }
delryn-online = { path = "crates/delryn-online" }
delryn-media = { path = "crates/delryn-media" }
delryn-format = { path = "crates/delryn-format" }
delryn-render = { path = "crates/delryn-render" }
delryn-library = { path = "crates/delryn-library" }
delryn-eqn = { path = "crates/delryn-eqn" }

# Debug builds keep the workspace crates unoptimized (fast incremental rebuilds,
# fully debuggable) but compile DEPENDENCIES with optimization. The image pipeline —
# `image` (decode / Lanczos3 resize / PNG encode), `pdfium-render`, and the `ratex-*`
# math rasterizers — is 20–50× slower unoptimized, which made library covers and
# equation rasters crawl in a `cargo run` / debug binary even though release was fine.
# Dependencies rebuild rarely, so their one-time optimized compile is well worth it.
[profile.dev.package."*"]
opt-level = 2

# …but that glob covers dependencies only, and delryn's *own* per-pixel image code lives
# here: the theme recolour/invert, the equation ink profiler, and the resamplers in
# `delryn-media`. Left unoptimized those loops ran 40–100× slower in the debug binary
# (`cargo build -p delryn`) than in release — theming one 1.3 MP figure cost 770 ms
# instead of 20 ms, and profiling one cost ~1 s — so a figure took about a second to
# appear and every arrow key in the image viewer stalled. The crate is small and changes
# rarely, so optimizing it costs almost nothing in rebuild time.
[profile.dev.package.delryn-media]
opt-level = 2

# Vendored ratatui-image patched to transmit Kitty images as PNG (f=100) rather
# than raw RGBA (f=32), so large figures don't stall the terminal. See
# vendor/ratatui-image/src/protocol/kitty.rs (delryn patch).
[patch.crates-io]
ratatui-image = { path = "vendor/ratatui-image" }

# Two fixes to RaTeX's font loading, carried here until an upstream release
# includes them. Between them they cut ~205 MB of resident memory from any document
# containing maths.
#
# * `ratex-font-loader` pulled in the *emoji* font whenever any non-ASCII character
#   lacked KaTeX metrics — so a maths book containing one `−` loaded Apple Color
#   Emoji (~183 MB) and cached it for the life of the process, without a single
#   emoji on the page. Now gated on the character actually being an emoji.
# * `ratex-unicode-font` reached system-font discovery through two separate
#   `OnceLock`s, reading the same file into two buffers (~22 MB duplicated). They
#   now share one.
#
# Vendored as paths rather than a git fork so CI needs no network or credentials.
# Upstream is MIT: https://github.com/erweixin/RaTeX
ratex-font-loader = { path = "third_party/ratex-font-loader" }
ratex-render = { path = "third_party/ratex-render" }
ratex-unicode-font = { path = "third_party/ratex-unicode-font" }
