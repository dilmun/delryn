[package]
name = "delryn"
# Literal (not `version.workspace = true`) so release-please's rust release-type can bump it.
# The library crates keep inheriting `[workspace.package].version`; delryn's own version is the
# one that drives releases (the vX.Y.Z tag). See docs/RELEASING.md.
version = "0.1.0"
edition.workspace = true
description = "A fast terminal reader for EPUB, PDF, and MOBI/AZW3 with real graphics"
license.workspace = true
repository.workspace = true

[dependencies]
delryn-model = { workspace = true }
delryn-infra = { workspace = true }
delryn-store = { workspace = true }
delryn-online = { workspace = true }
delryn-media = { workspace = true }
delryn-format = { workspace = true }
delryn-render = { workspace = true }
delryn-library = { workspace = true }
delryn-math = { workspace = true }
anyhow.workspace = true
arboard.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm.workspace = true
image.workspace = true
lru.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
regex.workspace = true
syntect.workspace = true
# Move deleted book files to the OS trash (recoverable) instead of unlinking —
# platform-specific (macOS Finder trash / Windows recycle bin / freedesktop XDG
# trash), which this crate abstracts.
trash = "5"
