[package]
name = "delryn"
version.workspace = true
edition.workspace = true
description = "A fast terminal reader for EPUB, PDF, and MOBI/AZW3 with real graphics"
license.workspace = true
repository.workspace = true

[dependencies]
delryn-model = { workspace = true }
delryn-infra = { workspace = true }
delryn-store = { workspace = true }
delryn-online = { workspace = true }
ar-reshaper.workspace = true
unicode-bidi.workspace = true
unicode-width.workspace = true
delryn-media = { workspace = true }
delryn-format = { workspace = true }
delryn-render = { workspace = true }
delryn-library = { workspace = true }
delryn-eqn = { workspace = true }
anyhow.workspace = true
arboard.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm.workspace = true
image.workspace = true
lru.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
regex.workspace = true
syntect.workspace = true
# Move deleted book files to the OS trash (recoverable) instead of unlinking —
# platform-specific (macOS Finder trash / Windows recycle bin / freedesktop XDG
# trash), which this crate abstracts.
trash = "5"

[target.'cfg(unix)'.dependencies]
# Redirect the process's stderr (fd 2) for the TUI's lifetime, so a dependency's stray
# `eprintln!` (the equation engine's RaTeX font-loader diagnostics) can't scribble into
# the alternate screen and desync the renderer. Only fd-level dup2 does this cleanly.
libc = "0.2"
