[package]
name = "delryn-eqn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Universal, encoding-agnostic equation recovery — the fresh replacement for the old
# math paths (docs/MATH-RENDERING.md). Detection + source recovery only; no rendering.
[dependencies]
# The math IR (MathItem etc.) is a pure domain type and lives in the shared model, so
# it can flow parser → model → reader; this crate is the engine that fills and consumes it.
delryn-model = { workspace = true }
scraper.workspace = true
ego-tree.workspace = true
# The typeset engine: recovered markup (LaTeX / Presentation MathML) is mapped into
# ParseNodes and laid out + rasterized by RaTeX (a from-scratch Rust engine, not a browser).
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-render.workspace = true
ratex-types.workspace = true
# Kitty graphics delivery: chunked base64 image transmits.
base64.workspace = true
# Compositing broken display equations: decode the per-line PNGs from RaTeX and stack them.
image.workspace = true
