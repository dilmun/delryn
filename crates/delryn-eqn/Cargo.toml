[package]
name = "delryn-eqn"
version.workspace = true
edition.workspace = true

# Universal, encoding-agnostic equation recovery — the fresh replacement for the old
# math paths (docs/MATH-RENDERING.md). Detection + source recovery only; no rendering.
[dependencies]
scraper.workspace = true
ego-tree.workspace = true
# The typeset engine's AST: recovered markup (LaTeX / Presentation MathML) is mapped
# into ParseNodes and laid out by RaTeX (a from-scratch Rust engine, not a browser).
ratex-parser.workspace = true
