name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR aborts the old run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A "clean build" means errors AND warnings clean. Dependencies (incl. the
  # vendored ratatui-image) are lint-capped by cargo, so this only denies warnings
  # in delryn's own crates.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No system packages needed: TLS is rustls, clipboard is x11rb (pure Rust),
      # SQLite is bundled, and libpdfium is bound at runtime — a C compiler (present
      # on every runner) is the only build requirement.
      - run: cargo build --workspace --locked
      # The one network test (delryn-online::live_search_dune) is #[ignore]d, so the
      # default run is fully headless/offline.
      - run: cargo test --workspace --locked

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `-D warnings` after `--` denies clippy's own lints (RUSTFLAGS only covers rustc lints).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Builds against the exact version `rust-version` in Cargo.toml declares, so the
  # promise the README makes is tested rather than asserted. It went untested for
  # months while the manifest claimed 1.85 and the tree used let-chains (1.88+) —
  # every CI job resolves `stable`, so nothing ever exercised the floor. Worth
  # adding to the required checks: a PR that reaches for a newer feature than the
  # declared floor should fail here, not in a user's terminal.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$version" ] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # `check`, not `build`: this asks whether the declared toolchain can compile
      # the tree, which is the claim being tested — the `test` jobs already build.
      - run: cargo check --workspace --all-targets --locked

  # Advisory scan, kept OUT of the required checks on purpose: a new advisory is
  # published against the dependency tree, not against the pull request that
  # happens to be open, so failing it here would block unrelated work on someone
  # else's disclosure schedule. It reports; a human decides. Reachability is what
  # matters — see the release audit's treatment of the quick-xml advisories, which
  # are in the tree via syntect but never fed any input.
  audit:
    name: audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
