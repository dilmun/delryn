name: release-build

# Reusable build matrix, called by release.yml (which fires on both the automated
# release-please tag and manual hotfix tags) so the target list lives in one place. Builds
# the `delryn` binary per target, bundles a matching libpdfium beside it, uploads tarball + .sha256.
on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to build for and upload assets to (e.g. v0.1.0)."
        required: true
        type: string

permissions:
  contents: write

env:
  # PDFium API level pdfium-render 0.9.2 targets (its `pdfium_latest` == `pdfium_7763`).
  # PINNED on purpose — do not float to `latest`. Bump this in lockstep with any
  # pdfium-render upgrade and re-verify by opening a real PDF from a built tarball.
  PDFIUM_RELEASE: chromium/7763

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            pdfium_asset: pdfium-linux-x64.tgz
            libname: libpdfium.so
          - target: aarch64-apple-darwin
            runner: macos-latest
            pdfium_asset: pdfium-mac-arm64.tgz
            libname: libpdfium.dylib
          - target: x86_64-apple-darwin
            runner: macos-latest # Apple toolchain cross-compiles x86_64 natively
            pdfium_asset: pdfium-mac-x64.tgz
            libname: libpdfium.dylib
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch + verify libpdfium
        run: |
          set -euo pipefail
          curl -sSfL -o "${{ matrix.pdfium_asset }}" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/${{ matrix.pdfium_asset }}"
          # This native library is both embedded in the binary and shipped beside
          # it, so verify against the pinned digest rather than trusting the
          # download. A release asset can be replaced upstream; a SHA-256 cannot.
          grep " ${{ matrix.pdfium_asset }}\$" .github/pdfium-checksums.txt > expected.sha256
          shasum -a 256 -c expected.sha256
          tar -xzf "${{ matrix.pdfium_asset }}" "lib/${{ matrix.libname }}"

      - name: Build delryn
        env:
          # Stamp the release version into the binary. release-please never rewrites
          # Cargo.toml (see docs/RELEASING.md), so CARGO_PKG_VERSION would otherwise
          # drift from the tag — and it's what `--version`, the crash log, and the
          # HTTP User-Agent all report.
          DELRYN_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The tag is `vX.Y.Z`; the version is what follows the `v`.
          export DELRYN_VERSION="${DELRYN_VERSION#v}"
          # Compile the verified library into the binary as a last-resort fallback,
          # so a `delryn` copied out of the tarball onto someone's PATH — leaving
          # the loose library behind — still opens PDFs instead of silently losing
          # the feature. Only used when no library is found on disk.
          export DELRYN_PDFIUM_LIB="$PWD/lib/${{ matrix.libname }}"
          cargo build --release --locked --target ${{ matrix.target }} -p delryn

      - name: Stage binary + bundled libpdfium
        run: |
          set -euo pipefail
          staging="delryn-${{ inputs.tag }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/delryn" "$staging/"
          # Ship it loose as well as embedded: found first, so an intact install
          # never pays the unpack, and it stays usable if the data directory is
          # read-only.
          cp "lib/${{ matrix.libname }}" "$staging/"
          # Include docs/licence when present (don't fail if they're absent).
          [ -f README.md ] && cp README.md "$staging/" || true
          for f in LICENSE LICENSE-MIT LICENSE-APACHE COPYING; do
            [ -f "$f" ] && cp "$f" "$staging/" || true
          done
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Archive + checksum
        run: |
          set -euo pipefail
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          # shasum is available on both ubuntu and macOS runners.
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" \
            "${STAGING}.tar.gz" "${STAGING}.tar.gz.sha256" \
            --clobber --repo "${{ github.repository }}"
