name: PR Title

# The PR title is the single Conventional Commit release-plz reads (squash-merge uses
# the PR title as the commit subject), so it must be a valid Conventional Commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # feat -> minor, fix -> patch, `!`/BREAKING -> major (minor while 0.x);
          # everything else -> no release. See docs/RELEASING.md.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          # Scope is optional (e.g. `fix(reader): ...` and `fix: ...` are both valid).
          requireScope: false
