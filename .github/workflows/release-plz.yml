name: release-plz

# The release engine. On every push to main it maintains a standing "release PR"
# (version bump + CHANGELOG). Merging that PR IS the release: this workflow then tags
# vX.Y.Z, creates the GitHub Release, and builds the binaries.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Don't cancel an in-flight release halfway through creating a tag/release.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains the standing release PR. Opens it with a short-lived token minted from
  # the "release bot" GitHub App — NOT the default GITHUB_TOKEN: a PR opened by
  # GITHUB_TOKEN does not trigger `pull_request` workflows, so CI + the PR-title check
  # would never run on the release PR, and with enforce_admins it would be permanently
  # unmergeable. See docs/RELEASING.md.
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # On the push that merged the release PR, create the tag + GitHub Release.
  # Deliberately uses the default GITHUB_TOKEN: the tag it creates must NOT re-trigger
  # the manual release.yml (`on: push: tags`) workflow, which would double-build. The
  # binary build is instead gated on this job's `releases_created` output below.
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build + attach the binaries only when a release was actually created.
  build:
    name: build
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    # `releases` is a JSON array; delryn is the only released package. `.tag` is the
    # git tag release-plz created (e.g. v0.2.0) — confirm the field on the first release.
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    permissions:
      contents: write
